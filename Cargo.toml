[package]
name = "void-settingsd"
version = "0.1.0"
edition = "2021"
description = "hostname1, timedate1 and locale1 D-Bus services for Void Linux (runit)"
license = "GPL-3.0-or-later"

[dependencies]
zbus = "5"
libc = "0.2"
async-io = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
